name: Release

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch format
        run: |
          BRANCH="${{ github.ref_name }}"

  release-common:
    needs: validate
    permissions:
      contents: write
    uses: ./.github/workflows/release-common.yml
    with:
      branch: ${{ github.ref_name }}
    secrets: inherit
